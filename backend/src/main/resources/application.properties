spring.application.name=career-pulse-api

#Web server
server.port=8080

#MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/career_pulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=careerpulse_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

#Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never